[project]
name = "citizen-registry-api"
version = "0.1.0"
description = "DPDP Act 2023-aware REST API for citizen records: consent, audit trail, masked identifiers."
readme = "README.md"
authors = [
    { name = "Sunil12Subu", email = "sunil.subramaniam.s@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]



[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = errors, I = import order, UP = modern Python syntax,
# B = likely bugs, S = security issues (hardcoded passwords, unsafe calls, ...)
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and fake passwords like "test-api-key"
"tests/**" = ["S101", "S105", "S106"]
# Autogenerated migrations can have long lines
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"   # print a summary of skipped/failed tests at the end